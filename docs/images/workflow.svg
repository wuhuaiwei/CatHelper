<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title"><title id="title">CatHelper：右键召唤、写下需求、查看答复、继续追问</title><g font-family="Microsoft YaHei UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1000" height="330" rx="24" fill="#FAF7FD" stroke="none"/><text x="32" y="48" font-size="26" fill="#514263" font-weight="bold">从右键召唤，到继续追问</text><text x="32" y="78" font-size="14" fill="#93849F" font-weight="normal">CatHelper 操作流程示意</text><rect x="28" y="108" width="220" height="184" rx="16" fill="white" stroke="#E8DFF2"/><rect x="44" y="124" width="38" height="32" rx="10" fill="#EEE5FA" stroke="none"/><text x="51" y="147" font-size="17" fill="#9270CE" font-weight="bold">01</text><text x="44" y="191" font-size="22" fill="#514263" font-weight="bold">右键召唤</text><text x="44" y="229" font-size="14" fill="#514263" font-weight="normal">文件 / 文件夹 / 空白处</text><text x="44" y="258" font-size="13" fill="#93849F" font-weight="normal">让小猫来到当前任务旁</text><rect x="272" y="108" width="220" height="184" rx="16" fill="white" stroke="#E8DFF2"/><rect x="288" y="124" width="38" height="32" rx="10" fill="#EEE5FA" stroke="none"/><text x="295" y="147" font-size="17" fill="#9270CE" font-weight="bold">02</text><text x="288" y="191" font-size="22" fill="#514263" font-weight="bold">写下需求</text><text x="288" y="229" font-size="14" fill="#514263" font-weight="normal">点击小猫展开输入框</text><text x="288" y="258" font-size="13" fill="#93849F" font-weight="normal">Enter 发送 · 组合键换行</text><rect x="516" y="108" width="220" height="184" rx="16" fill="white" stroke="#E8DFF2"/><rect x="532" y="124" width="38" height="32" rx="10" fill="#EEE5FA" stroke="none"/><text x="539" y="147" font-size="17" fill="#9270CE" font-weight="bold">03</text><text x="532" y="191" font-size="22" fill="#514263" font-weight="bold">查看答复</text><text x="532" y="229" font-size="14" fill="#514263" font-weight="normal">消息可以选字与复制</text><text x="532" y="258" font-size="13" fill="#93849F" font-weight="normal">长文本按像素小步滚动</text><rect x="760" y="108" width="220" height="184" rx="16" fill="white" stroke="#E8DFF2"/><rect x="776" y="124" width="38" height="32" rx="10" fill="#EEE5FA" stroke="none"/><text x="783" y="147" font-size="17" fill="#9270CE" font-weight="bold">04</text><text x="776" y="191" font-size="22" fill="#514263" font-weight="bold">继续追问</text><text x="776" y="229" font-size="14" fill="#514263" font-weight="normal">同一窗口保留对话上下文</text><text x="776" y="258" font-size="13" fill="#93849F" font-weight="normal">需要时切换允许修改</text></g></svg>
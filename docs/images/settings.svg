<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title"><title id="title">伙伴设置选项与窗口操作示意图（非实机截图）</title><g font-family="Microsoft YaHei UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1000" height="720" rx="24" fill="#F4EFF9" stroke="none"/><text x="34" y="42" font-size="25" fill="#514263" font-weight="bold">伙伴设置 · 界面示意</text><text x="34" y="70" font-size="15" fill="#93849F" font-weight="normal">示例内容，非实机截图；实际模型列表以 CLI 返回为准。</text><rect x="28" y="94" width="614" height="602" rx="24" fill="#FAF7FD" stroke="#DED0ED"/><text x="52" y="124" font-size="13" fill="#93849F" font-weight="normal">伙伴设置</text><rect x="588" y="106" width="30" height="28" rx="9" fill="#EEE5FA" stroke="none"/><text x="597" y="127" font-size="22" fill="#9270CE" font-weight="normal">×</text><text x="58" y="178" font-size="28" fill="#514263" font-weight="bold">伙伴的小偏好</text><text x="58" y="206" font-size="15" fill="#93849F" font-weight="normal">把每一点小习惯，调成喜欢的样子。</text><rect x="50" y="228" width="570" height="144" rx="22" fill="white" stroke="#EEE6F5"/><text x="70" y="255" font-size="15" fill="#A28AB6" font-weight="bold">01   认识你的伙伴</text><rect x="50" y="388" width="570" height="222" rx="22" fill="white" stroke="#EEE6F5"/><text x="70" y="417" font-size="15" fill="#A28AB6" font-weight="bold">02   伙伴的 AI 魔法</text><text x="70" y="292" font-size="16" fill="#514263" font-weight="normal">伙伴昵称</text><rect x="222" y="266" width="376" height="38" rx="10" fill="#FCFAFF" stroke="#E8E0F0"/><text x="236" y="292" font-size="16" fill="#514263" font-weight="normal">小爱</text><text x="70" y="339" font-size="16" fill="#514263" font-weight="normal">伙伴图标大小</text><rect x="222" y="313" width="376" height="38" rx="10" fill="#FCFAFF" stroke="#E8E0F0"/><text x="236" y="339" font-size="16" fill="#514263" font-weight="normal">中</text><text x="574" y="339" font-size="19" fill="#9D82BE" font-weight="normal">⌄</text><text x="70" y="455" font-size="16" fill="#514263" font-weight="normal">默认 AI</text><rect x="222" y="429" width="376" height="38" rx="10" fill="#FCFAFF" stroke="#E8E0F0"/><text x="236" y="455" font-size="16" fill="#514263" font-weight="normal">codex</text><text x="574" y="455" font-size="19" fill="#9D82BE" font-weight="normal">⌄</text><text x="70" y="502" font-size="16" fill="#514263" font-weight="normal">Codex 程序</text><rect x="222" y="476" width="286" height="38" rx="10" fill="#FCFAFF" stroke="#E8E0F0"/><text x="236" y="502" font-size="16" fill="#514263" font-weight="normal">codex</text><rect x="518" y="476" width="80" height="38" rx="10" fill="#F1EAFB" stroke="none"/><text x="542" y="502" font-size="16" fill="#7959A6" font-weight="normal">浏览</text><text x="70" y="549" font-size="16" fill="#514263" font-weight="normal">Codex 模型</text><rect x="222" y="523" width="376" height="38" rx="10" fill="#FCFAFF" stroke="#E8E0F0"/><text x="236" y="549" font-size="16" fill="#514263" font-weight="normal">默认（跟随 CLI）</text><text x="574" y="549" font-size="19" fill="#9D82BE" font-weight="normal">⌄</text><rect x="70" y="576" width="15" height="15" rx="4" fill="#FCFAFF" stroke="#C4B0DC"/><text x="95" y="590" font-size="15" fill="#514263" font-weight="normal">默认禁止修改</text><text x="53" y="657" font-size="13" fill="#93849F" font-weight="normal">每次召唤，都更懂你一点。</text><rect x="448" y="630" width="172" height="43" rx="15" fill="#9270CE" stroke="none"/><text x="487" y="658" font-size="17" fill="white" font-weight="normal">保存小偏好</text><rect x="672" y="124" width="300" height="78" rx="15" fill="white" stroke="none"/><text x="690" y="151" font-size="18" fill="#8062CB" font-weight="bold">圆角窗口</text><text x="690" y="179" font-size="13" fill="#93849F" font-weight="normal">拖动标题移动，右下角缩放</text><rect x="672" y="260" width="300" height="78" rx="15" fill="white" stroke="none"/><text x="690" y="287" font-size="18" fill="#8062CB" font-weight="bold">昵称与大小</text><text x="690" y="315" font-size="13" fill="#93849F" font-weight="normal">让伙伴拥有你喜欢的名字和尺寸</text><rect x="672" y="414" width="300" height="78" rx="15" fill="white" stroke="none"/><text x="690" y="441" font-size="18" fill="#8062CB" font-weight="bold">只显示选中的 AI</text><text x="690" y="469" font-size="13" fill="#93849F" font-weight="normal">切换后保留各自路径与模型设置</text><rect x="672" y="512" width="300" height="78" rx="15" fill="white" stroke="none"/><text x="690" y="539" font-size="18" fill="#8062CB" font-weight="bold">模型自动获取</text><text x="690" y="567" font-size="13" fill="#93849F" font-weight="normal">成功后启用下拉框，失败可悬浮查看</text><rect x="672" y="619" width="300" height="78" rx="15" fill="white" stroke="none"/><text x="690" y="646" font-size="18" fill="#8062CB" font-weight="bold">打开设置时</text><text x="690" y="674" font-size="13" fill="#93849F" font-weight="normal">气泡暂时收起，草稿与显示状态保留</text></g></svg>